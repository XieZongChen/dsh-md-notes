<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-md-notes 图标预览（已裁剪 viewBox）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 16px; }
  .row { display: flex; gap: 32px; align-items: flex-start; margin-bottom: 24px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell span { font-size: 12px; color: #888; }
  .light { background: #fff; border: 1px solid #ddd; }
  .dark { background: #1a1a1a; border: 1px solid #444; }
  .box { width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  img { display: block; }
</style>
</head>
<body>
  <h1>dsh-md-notes 图标（viewBox 已裁掉四周留白）</h1>
  <p>浅色底 / 深色底，尺寸 16 / 18 / 32 / 64px，对应侧边栏与操作栏实际使用规格。</p>

  <div class="row">
    <div class="cell"><div class="box light"><img src="./dsh-md-notes.svg" width="16" height="16" alt=""></div><span>16px · 浅底</span></div>
    <div class="cell"><div class="box dark"><img src="./dsh-md-notes.svg" width="16" height="16" alt=""></div><span>16px · 深底</span></div>
    <div class="cell"><div class="box light"><img src="./dsh-md-notes.svg" width="18" height="18" alt=""></div><span>18px · 浅底</span></div>
    <div class="cell"><div class="box dark"><img src="./dsh-md-notes.svg" width="18" height="18" alt=""></div><span>18px · 深底</span></div>
    <div class="cell"><div class="box light"><img src="./dsh-md-notes.svg" width="32" height="32" alt=""></div><span>32px · 浅底</span></div>
    <div class="cell"><div class="box dark"><img src="./dsh-md-notes.svg" width="32" height="32" alt=""></div><span>32px · 深底</span></div>
    <div class="cell"><div class="box light"><img src="./dsh-md-notes.svg" width="64" height="64" alt=""></div><span>64px · 浅底</span></div>
    <div class="cell"><div class="box dark"><img src="./dsh-md-notes.svg" width="64" height="64" alt=""></div><span>64px · 深底</span></div>
  </div>

  <p><b>提示：</b>在浏览器打开本文件（<code>open assets/preview.html</code>）即可查看；如果裁剪后边距还想再收/放宽，改 <code>assets/dsh-md-notes.svg</code> 开头的 viewBox 即可，无需重新构建。</p>
</body>
</html>
